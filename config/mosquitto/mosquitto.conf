# Mosquitto MQTT Broker Configuration for Smart City IoT Platform

# Default listener
listener 1883
protocol mqtt

# WebSocket listener
listener 9001
protocol websockets

# Allow anonymous connections (disable in production)
allow_anonymous false

# Password file
password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Connection limits
max_connections -1
max_queued_messages 1000

# Message size limit (10MB)
message_size_limit 10485760

# Keep alive
keepalive_interval 60

# ACL (Access Control List)
# acl_file /mosquitto/config/acl

# Quality of Service
max_qos 2
